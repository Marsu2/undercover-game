        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }
        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:active { background-color: #c0392b; }
        input {
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
        }
        h1 { font-size: 30px; }
        .hidden { display: none; }
        #mot-secret { font-size: 35px; color: #f1c40f; font-weight: bold; margin: 20px 0; }
        #message-role { font-size: 22px; }
        
        /* Style pour la liste des joueurs */
        #liste-joueurs-container {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .etiquette-joueur {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-supprimer {
            color: #ff6b6b;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

        <p>Ajoute les joueurs :</p>

        // Mettre à jour l'affichage de la liste des joueurs
        function actualiserAffichageJoueurs() {
            const container = document.getElementById('liste-joueurs-container');
            container.innerHTML = ""; // On vide la liste avant de la recréer

            joueurs.forEach((joueur, index) => {
                container.innerHTML += `
                    <div class="etiquette-joueur">
                        ${joueur} 
                        <span class="btn-supprimer" onclick="supprimerJoueur(${index})">❌</span>
                    </div>
                `;
            });

            document.getElementById('compteur-joueurs').innerText = `Joueurs : ${joueurs.length}`;
            
            // On sauvegarde dans la mémoire du navigateur
            localStorage.setItem('undercover_joueurs', JSON.stringify(joueurs));
        }

        // Ajouter un joueur depuis le champ texte
        function ajouterJoueur() {
            const input = document.getElementById('nom-joueur');
            if (input.value.trim() !== "") {
                joueurs.push(input.value.trim());
                input.value = "";
                actualiserAffichageJoueurs();
            }
        }

        // Permet d'ajouter un joueur en appuyant sur la touche "Entrée"
        document.getElementById("nom-joueur").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                ajouterJoueur();
            }
        });

        // Supprimer un joueur de la liste
        function supprimerJoueur(index) {
            joueurs.splice(index, 1);
            actualiserAffichageJoueurs();
        }

        // Lancer la partie
        function lancerJeu() {
            const nbJoueurs = joueurs.length;
            if (nbJoueurs < 3) {
                alert("Il faut au moins 3 joueurs !");
                return;
            }

            const paire = mots[Math.floor(Math.random() * mots.length)];
            
            let nbImposteurs = 0;
            let nbMrWhite = 0;

            if (nbJoueurs === 3 || nbJoueurs === 4) {
                nbImposteurs = 1;
            } else if (nbJoueurs === 5 || nbJoueurs === 6) {
                nbImposteurs = 1;
                nbMrWhite = 1;
            } else if (nbJoueurs >= 7 && nbJoueurs <= 9) {
                nbImposteurs = 2;
                nbMrWhite = 1;
            } else if (nbJoueurs >= 10) { 
                nbImposteurs = 2;
                nbMrWhite = 2;
            }

            const nbCivils = nbJoueurs - nbImposteurs - nbMrWhite;
            repartition = [];

            for (let i = 0; i < nbImposteurs; i++) {
                repartition.push({ role: "Imposteur", mot: paire.undercover });
            }
            for (let i = 0; i < nbMrWhite; i++) {
                repartition.push({ role: "Mr. White", mot: null });
            }
            for (let i = 0; i < nbCivils; i++) {
                repartition.push({ role: "Civil", mot: paire.civil });
            }

            repartition.sort(() => Math.random() - 0.5);

            document.getElementById('ecran-setup').classList.add('hidden');
            afficherTransition();
        }

        function afficherTransition() {
            if (indexActuel < joueurs.length) {
                document.getElementById('nom-actuel').innerText = joueurs[indexActuel];
                document.getElementById('ecran-mot').classList.add('hidden');
                document.getElementById('ecran-transition').classList.remove('hidden');
            } else {
                document.getElementById('ecran-transition').classList.add('hidden');
                document.getElementById('ecran-mot').classList.add('hidden');
                document.getElementById('ecran-fin').classList.remove('hidden');
            }
        }

        function voirMot() {
            document.getElementById('ecran-transition').classList.add('hidden');
            
            const donneesJoueur = repartition[indexActuel];
            const divMessage = document.getElementById('message-role');
            const divMot = document.getElementById('mot-secret');

            if (donneesJoueur.role === "Mr. White") {
                divMessage.innerText = "Tu es Mr. White 🕵️‍♂️ !";
                divMot.innerText = "Tu n'as pas de mot. Fais semblant et devine le mot des autres !";
                divMot.style.fontSize = "22px";
                divMot.style.color = "white";
            } else {
                divMessage.innerText = "Ton mot secret est :";
                divMot.innerText = donneesJoueur.mot;
                divMot.style.fontSize = "35px";
                divMot.style.color = "#f1c40f";
            }

            document.getElementById('ecran-mot').classList.remove('hidden');
        }

        function joueurSuivant() {
            indexActuel++;
            afficherTransition();
        }

        // Réinitialise la partie sans recharger la page et garde les joueurs
        function nouvellePartie() {
            indexActuel = 0;
            repartition = [];
            document.getElementById('ecran-fin').classList.add('hidden');
            document.getElementById('ecran-setup').classList.remove('hidden');
        }

        // Au chargement de la page, on affiche les joueurs enregistrés
